# sandboxshift.yaml — fastapi-local example
#
# Runs a FastAPI server locally in Podman.
# Open http://localhost:8000/docs for the interactive Swagger UI.
#
# Equivalent CLI (overrides this file):
#   sandboxshift run examples/fastapi-local \\
#     "python -m uvicorn main:app --host 0.0.0.0 --port 8000" \\
#     --mode local \\
#     --port 8000 \\
#     --setup "pip install -r requirements.txt"
#
# Note: 'python -m uvicorn' is used instead of 'uvicorn' directly to avoid
# PATH issues with pip user-installs. After rebuilding images with
# 'make -C images build-python' (which adds ~/.local/bin to PATH), plain
# 'uvicorn' will also work.

sandbox:
  mode: local
  timeout: 3600
  setup: "pip install -r requirements.txt"

workspace:
  readonly: false

network:
  allow:
    - pypi.org     # needed for pip install during setup
    - files.pythonhosted.org

resources:
  cpu: 1.0
  memory: 512MB

ports:
  - 8000:8000     # http://localhost:8000  (host → container)
                  # SandboxShift also injects PORT=8000 as an env var
