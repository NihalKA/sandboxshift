# sandboxshift.yaml — nodejs-cloud example
#
# Runs the Express server on AWS Fargate.
# Cloud burst must be set up first: ./sandboxshift-setup.sh cloud
#
# After the task starts, run:
#   sandboxshift list             → get the public IP and URL
#   sandboxshift stop <id>        → stop the server when done
#
# Equivalent CLI (overrides this file):
#   sandboxshift run examples/nodejs-cloud "node index.js" \\
#     --mode cloud \\
#     --port 3000 \\
#     --setup "npm ci"

sandbox:
  mode: cloud
  timeout: 3600
  setup: "npm ci"

workspace:
  readonly: false

# network.allow has no effect on Fargate — outbound access is controlled
# by your VPC routing and security groups, not by SandboxShift.

resources:
  # cpu and memory apply to BOTH local and cloud.
  # Local:  enforced as Podman cgroup limits.
  # Cloud:  FargateRuntime registers a fresh ECS task definition per run
  #         with the exact CPU/memory requested (Decision #64).
  #         Must be a valid Fargate combination — see README for valid combos.
  cpu: 1.0
  memory: 2GB

ports:
  - 3000:3000
