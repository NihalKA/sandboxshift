# sandboxshift.yaml — fastapi-cloud example
#
# Runs the FastAPI server on AWS Fargate.
# Cloud burst must be set up first: ./sandboxshift-setup.sh cloud
#
# After the task starts:
#   sandboxshift list                       → get the public IP and URL
#   curl http://<public-ip>:8000/docs       → interactive Swagger UI
#   sandboxshift stop <instance_id>         → stop when done
#
# Equivalent CLI (overrides this file):
#   sandboxshift run examples/fastapi-cloud \\
#     "python -m uvicorn main:app --host 0.0.0.0 --port 8000" \\
#     --mode cloud \\
#     --port 8000 \\
#     --setup "pip install -r requirements.txt"
#
# Note: 'python -m uvicorn' is used instead of 'uvicorn' directly to avoid
# PATH issues with pip user-installs. After rebuilding images with
# 'make -C images build-multi' (which adds ~/.local/bin to PATH), plain
# 'uvicorn' will also work.

sandbox:
  mode: cloud
  timeout: 3600
  setup: "pip install -r requirements.txt"

workspace:
  readonly: false

# network.allow has no effect on Fargate — outbound access is controlled
# by your VPC routing and security groups, not by SandboxShift.

resources:
  # cpu and memory apply to BOTH local and cloud.
  # Local:  enforced as Podman cgroup limits.
  # Cloud:  FargateRuntime registers a fresh ECS task definition per run
  #         with the exact CPU/memory requested (Decision #64).
  #         Must be a valid Fargate combination — see README for valid combos.
  cpu: 1.0
  memory: 2GB

ports:
  - 8000:8000
