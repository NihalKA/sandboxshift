# sandboxshift.yaml — nodejs-local example
#
# Runs the Express server in a local Podman sandbox (mode: local forces this).
# Port 3000 is bound to 127.0.0.1:3000 on the host.

sandbox:
  mode: local           # force local always — remove this line to use auto-burst logic
  timeout: 3600
  setup: "npm ci"

workspace:
  readonly: false
  # upload_allow lets you push specific sensitive filenames to S3 when
  # bursting to cloud (e.g. a non-secret runtime .env).
  # Exact filename match only. Each override is recorded in the audit log.
  # Commented out here because this example runs locally — uncomment when
  # switching to cloud mode and you need .env available in the container.
  #
  # upload_allow:
  #   - .env

# Environment variables injected into the container.
# Useful for npm tokens, API keys, and other runtime config.
# Values are NEVER written to the audit log — only key names are recorded.
# CLI --env KEY=VAL overrides this entire section when set.
#
# env:
#   NODE_ENV: development
#   MY_API_KEY: "..."

network:
  allow:
    - registry.npmjs.org
    - registry.yarnpkg.com

resources:
  # ── Container limits (applied inside the sandbox) ──────────────────────────
  # These cap what the container can use. They do NOT affect the burst decision.
  cpu: 1.0              # container CPU cap (Podman cgroup)
  memory: 512MB         # container RAM cap (Podman cgroup)

  # ── Burst triggers (auto-mode only) ────────────────────────────────────────
  # If your local machine doesn't meet these, SandboxShift bursts to AWS.
  # Only active when sandbox.mode is "auto" (or not set).
  # min_cpu: 4          # burst if local machine has fewer than 4 CPUs
  # min_memory: 8GB     # burst if local machine has less than 8GB available RAM

ports:
  - 3000:3000
