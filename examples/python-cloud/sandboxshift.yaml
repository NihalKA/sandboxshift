# sandboxshift.yaml — python-cloud example
#
# Runs a Python task on AWS Fargate with 4 vCPU / 8 GB RAM.
# Requires cloud setup: ./sandboxshift-setup.sh cloud
#
# setup: installs dependencies before executing the main task.
# upload_allow: opts the .env file into S3 upload despite matching
#               SandboxShift's default sensitive-file filter.
#
# Equivalent CLI (overrides this file):
#   sandboxshift run examples/python-cloud "python main.py" \
#     --mode cloud \
#     --setup "pip install -r requirements.txt" \
#     --allow-file .env \
#     --env MY_API_KEY=sk_live_xxx

sandbox:
  mode: cloud
  timeout: 600
  setup: "pip install -r requirements.txt"

workspace:
  readonly: false
  upload_allow:
    - .env   # .env is blocked by default; list it here to opt in for cloud runs
             # each allowed filename is recorded in the audit log

# Environment variables injected into the container.
# Useful for API keys, service tokens, and other runtime config.
# Values are NEVER written to the audit log — only key names are recorded.
# CLI --env KEY=VAL overrides this entire section when set.
#
# env:
#   MY_API_KEY: "sk_live_xxx"
#   ENVIRONMENT: production

resources:
  cpu: 4.0
  memory: 8GB
