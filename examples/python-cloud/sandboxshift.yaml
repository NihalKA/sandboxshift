# sandboxshift.yaml — python-cloud example
#
# Bursts to AWS Fargate. Requires 'sandboxshift-setup.sh cloud' to have
# been run at least once so ~/.sandboxshift/fargate.env exists.
#
# This example uploads a .env file alongside the workspace.
# SandboxShift blocks .env uploads by default — workspace.upload_allow
# explicitly opts this file in. The override is recorded in the audit log.

sandbox:
  mode: cloud
  timeout: 600
  setup: "pip install -r requirements.txt"

workspace:
  readonly: false
  # Allow .env to be uploaded to S3 so the task can read runtime config.
  # Remove or comment this out if your .env contains real secrets —
  # SandboxShift will then refuse to upload it and force a local run instead.
  upload_allow:
    - .env

resources:
  cpu: 4.0
  memory: 8GB
